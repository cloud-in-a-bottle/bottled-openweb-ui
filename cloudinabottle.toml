[app]
name = "openweb-ui"
version = "0.1.0"
description = "Open WebUI on Cloud in a Bottle"

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/health"

[resources]
memory_mb = 2048
# Measured clean --no-cache build peak ~6758 MiB (6.60 GiB), from
# pulling/extracting the open-webui base image. Runtime memory_mb (2048)
# is lower, so without an explicit build cap the build can OOM. Sized to
# the measured peak rounded up to the next 0.5 GiB.
build_memory_mb = 7168
cpu_cores = 1.0

[data]
app_data = true
# to store Open WebUI's cache (embedding/whisper/tiktoken models).
app_temp_data = true

# Consume the Bifrost gateway's OpenAI-compatible API. Wired up automatically as
# an Open WebUI model provider via a local mitmproxy that injects the app token
# (see openhost_bifrost_proxy.py / openhost_start.sh). The `full_access` grant is
# requested at install time.
[[services.v2.consumes]]
service = "github.com/imbue-openhost/openhost-bifrost-llm-gateway/services/openai-compat"
shortname = "llm"
version = ">=0.1.0"
grants = ["full_access"]
